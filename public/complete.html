<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Verification Process — Completed</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #111827;
    }

    .topnav {
      height: 60px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #000000;
    }

    .logo span {
      color: #2563eb;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #15803d;
      font-weight: 600;
    }

    .progress-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #16a34a;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }

    .progress-line {
      width: 40px;
      height: 1px;
      background: #86efac;
    }

    .page {
      min-height: calc(100vh - 60px);
      padding: 48px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.12), transparent 36%),
        linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%);
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 40px 32px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dcfce7;
      color: #15803d;
      font-size: 34px;
      font-weight: 800;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.7;
    }

    .note {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      background: #f0fdf4;
      color: #166534;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .topnav {
        padding: 0 16px;
      }

      .progress-step span {
        display: none;
      }

      .progress-line {
        width: 22px;
      }

      .page {
        padding: 24px 14px;
      }

      .card {
        padding: 32px 20px;
      }
    }
  </style>
</head>

<body>
  <nav class="topnav">
    <div class="logo">Verification <span>Process</span></div>

    <!--
      Populated by JS on load. If a `token` is present in the URL,
      the lead came here via the Agreement form's redirect
      (Cardless flow), so we show the 4-step version with Agreement.
      Otherwise the lead is Physical (no Agreement step) and we show
      the original 3-step version.
    -->
    <div class="progress-wrap" id="progressWrap"></div>
  </nav>

  <main class="page">
    <section class="card">
      <div class="icon">✓</div>

      <h1>Verification Completed</h1>

      <p>
        Your application and identity verification were completed successfully.
        Verification Process will review your information and contact you if anything
        else is required.
      </p>

      <div class="note">
        You may safely close this page.
      </div>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = (params.get("token") || "").trim();

      // A token in the URL here means the Agreement form's own
      // "Redirect URL after submit" sent the user here — i.e. this
      // is a Cardless lead that went through the Agreement step.
      // Physical leads arrive at plain "/complete" with no token.
      const hasAgreement = token !== "";

      renderProgress(hasAgreement);

      if (hasAgreement) {
        finalizeAgreementCompletion(token);
      }

      // Safe to clear regardless of which flow this was.
      sessionStorage.removeItem("plaid_token");

      function renderProgress(hasAgreementStep) {
        const wrap = document.getElementById("progressWrap");

        if (!wrap) {
          return;
        }

        const steps = hasAgreementStep
          ? ["Application", "Verify Identity", "Agreement", "Complete"]
          : ["Application", "Verify Identity", "Completed"];

        wrap.innerHTML = steps
          .map(function (label, index) {
            const step =
              '<div class="progress-step">' +
              '<div class="progress-num">\u2713</div>' +
              "<span>" + label + "</span>" +
              "</div>";

            const isLast = index === steps.length - 1;
            const line = isLast ? "" : '<div class="progress-line"></div>';

            return step + line;
          })
          .join("");
      }

      // Finalizes the CRM record for Cardless leads (stage ->
      // Completed, token -> Used). This is required because the
      // Agreement stage on its own does not mark the lead Completed
      // or the token Used — this call is what closes it out, per
      // /api/idv/complete on the server.
      async function finalizeAgreementCompletion(agreementToken) {
        try {
          const response = await fetch("/api/idv/complete", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ token: agreementToken }),
            cache: "no-store",
          });

          const data = await response.json().catch(function () {
            return {};
          });

          if (!response.ok || !data.success) {
            // Not shown to the user: by the time they're on this
            // page they've already finished the Agreement form, so
            // we don't want to surface an error card here. The most
            // common non-fatal cause is the token already being
            // marked Used (e.g. the user refreshed this page).
            console.warn(
              "Could not finalize Agreement completion:",
              data.message || ("HTTP " + response.status)
            );
            return;
          }

          console.log("Agreement completion finalized in CRM.");
        } catch (error) {
          console.warn(
            "Could not reach /api/idv/complete:",
            error.message
          );
        }
      }
    })();
  </script>
</body>
</html>
