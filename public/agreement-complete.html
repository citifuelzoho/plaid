<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Verification Process — Finishing Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      padding: 48px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.12), transparent 36%),
        linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%);
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 22px;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.65;
    }

    .error-box {
      display: none;
      margin-top: 20px;
      padding: 14px 16px;
      border: 1px solid #fecaca;
      border-radius: 10px;
      background: #fef2f2;
      color: #991b1b;
      font-size: 13px;
      line-height: 1.55;
      text-align: left;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="spinner"></div>
      <h1>Finishing up</h1>
      <p id="status-text">Saving your agreement...</p>
      <div class="error-box" id="error-box" role="alert"></div>
    </section>
  </main>

  <script>
    /*
     * MUHIM: Xuddi verify.html'dagi kabi — Zoho Agreement
     * form ba'zan "Redirect URL after submit"ni iframe'ning
     * O'ZI ICHIDA amalga oshirishi mumkin. Shuni oldini olish
     * uchun, agar bu skript o'zini iframe ichida topsa, darhol
     * top-level oynani shu manzilga o'tkazadi.
     */
    (function breakOutOfIframe() {
      try {
        if (window.top !== window.self) {
          window.top.location.href = window.location.href;
        }
      } catch (error) {
        try {
          window.top.location.href = window.location.href;
        } catch (innerError) {
          console.warn(
            "Could not break out of iframe:",
            innerError
          );
        }
      }
    })();
  </script>

  <script>
    const COMPLETE_IDV_API = "/api/idv/complete";
    const COMPLETE_ROUTE = "/complete";

    function readTokenFromHash() {
      const hash = window.location.hash.replace(/^#/, "");
      const hashParams = new URLSearchParams(hash);
      return hashParams.get("token");
    }

    function getToken() {
      const params = new URLSearchParams(window.location.search);
      const tokenFromUrl = params.get("token") || readTokenFromHash();

      if (tokenFromUrl && tokenFromUrl.trim() !== "") {
        return tokenFromUrl.trim();
      }

      // Fall back to whatever was stored while moving through
      // the earlier steps, in case Zoho's redirect ever drops
      // the ${Plaid_Token} merge tag.
      return sessionStorage.getItem("plaid_token") || null;
    }

    function setStatus(message) {
      const statusText = document.getElementById("status-text");

      if (statusText) {
        statusText.textContent = message;
      }
    }

    function showError(message) {
      const errorBox = document.getElementById("error-box");

      if (!errorBox) {
        console.error(message);
        return;
      }

      errorBox.textContent = message || "Something went wrong.";
      errorBox.style.display = "block";
    }

    async function requestJson(url, options) {
      const response = await fetch(url, {
        cache: "no-store",
        ...options,
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.message || `Request failed with status ${response.status}`
        );
      }

      return data;
    }

    async function completeAgreement() {
      const token = getToken();

      console.log("\n=== AGREEMENT COMPLETE PAGE LOADED ===");
      console.log("Token exists:", Boolean(token));
      console.log("======================================\n");

      if (!token) {
        setStatus("Verification link is not available.");
        showError(
          "Agreement token is missing. Please open the original link from your email."
        );
        return;
      }

      try {
        const data = await requestJson(COMPLETE_IDV_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ token }),
        });

        console.log("Completion response:", data);

        sessionStorage.removeItem("plaid_token");

        setStatus("All done. Redirecting...");
        window.location.replace(COMPLETE_ROUTE);
      } catch (error) {
        console.error("Failed to finalize completion:", error);

        setStatus("We couldn't finish saving your agreement.");
        showError(
          error.message ||
            "Your agreement was submitted, but we couldn't update your record. Please contact support."
        );
      }
    }

    completeAgreement();
  </script>
</body>
</html>
